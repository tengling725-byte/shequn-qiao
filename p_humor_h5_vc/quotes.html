<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>名句棒棒糖</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: #f5f0e6;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
    }
    .page-quotes {
      background: transparent;
    }
    .quote-card {
      background: #fffef8;
      border: 1px solid #d4c9b0;
      box-shadow: 0 2px 8px rgba(139, 119, 101, 0.1);
      background-image: linear-gradient(135deg, #fffef8 0%, #f8f4e8 100%);
    }
    .quote-text {
      color: #4a4a4a;
      font-family: "SimSun", "STSong", "Songti SC", serif;
    }
    .quote-author {
      color: #8b7765;
    }
    .header h2 {
      color: #5a4a3a;
    }
    .back-btn {
      color: #8b7765;
    }
    .quote-nav button {
      background: #f5f0e6;
      border: 1px solid #d4c9b0;
      color: #8b7765;
    }
    .quote-nav span {
      color: #a09080;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="quotes-container">
      <div class="header">
        <button class="back-btn" onclick="location.href='index.html'">← 返回</button>
        <h2>🍭 名句棒棒糖</h2>
      </div>
      
      <div class="quote-card">
        <p class="quote-text" id="quote-text"></p>
        <p class="quote-author" id="quote-author"></p>
      </div>
      
      <div class="quote-nav">
        <button onclick="prev()">◀ 上一条</button>
        <span id="quote-index">1/68</span>
        <button onclick="next()">下一条 ▶</button>
      </div>
    </div>
  </div>
  
  <script src="js/data.js"></script>
  <script>
    var currentIndex = 0;
    var quoteList = quotes;
    
    function show() {
      document.getElementById('quote-text').textContent = quoteList[currentIndex].text;
      document.getElementById('quote-author').textContent = '—— ' + quoteList[currentIndex].author;
      document.getElementById('quote-index').textContent = (currentIndex + 1) + '/' + quoteList.length;
    }
    
    function prev() {
      currentIndex--;
      if (currentIndex < 0) currentIndex = quoteList.length - 1;
      show();
    }
    
    function next() {
      currentIndex++;
      if (currentIndex >= quoteList.length) currentIndex = 0;
      show();
    }
    
    document.addEventListener('DOMContentLoaded', show);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>文言豆腐干</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background: #f5f0e6;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.05'/%3E%3C/svg%3E");
    }
    .wenyan-card {
      background: #fffef8;
      border: 1px solid #d4c9b0;
      box-shadow: 0 2px 8px rgba(139, 119, 101, 0.1);
      background-image: linear-gradient(135deg, #fffef8 0%, #f8f4e8 100%);
    }
    .wenyan-title {
      color: #5a4a3a;
    }
    .wenyan-original {
      color: #4a4a4a;
      font-family: "SimSun", "STSong", "Songti SC", serif;
    }
    .wenyan-note {
      color: #6a5a4a;
    }
    .wenyan-tap {
      color: #a09080;
    }
    .header h2 {
      color: #5a4a3a;
    }
    .back-btn {
      color: #8b7765;
    }
    .wenyan-nav button {
      background: #f5f0e6;
      border: 1px solid #d4c9b0;
      color: #8b7765;
    }
    .wenyan-nav span {
      color: #a09080;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="wenyan-container">
      <div class="header">
        <button class="back-btn" onclick="location.href='index.html'">← 返回</button>
        <h2>🧱 文言豆腐干</h2>
      </div>
      
      <div class="wenyan-card" onclick="toggleNote()">
        <h3 id="wenyan-title"></h3>
        <p class="wenyan-original" id="wenyan-original"></p>
        <p class="wenyan-note" id="wenyan-note" style="display:none"></p>
        <p class="wenyan-tap" id="wenyan-tap">点击显示注释</p>
      </div>
      
      <div class="wenyan-nav">
        <button onclick="prev()">◀ 上一条</button>
        <span id="wenyan-index">1/10</span>
        <button onclick="next()">下一条 ▶</button>
      </div>
    </div>
  </div>
  
  <script src="js/data.js"></script>
  <script>
    var currentIndex = 0;
    var noteVisible = false;
    var wenyanList = wenyanItems;
    
    function show() {
      document.getElementById('wenyan-title').textContent = wenyanList[currentIndex].title;
      document.getElementById('wenyan-original').textContent = wenyanList[currentIndex].original;
      document.getElementById('wenyan-note').textContent = wenyanList[currentIndex].note;
      document.getElementById('wenyan-index').textContent = (currentIndex + 1) + '/' + wenyanList.length;
      
      document.getElementById('wenyan-note').style.display = 'none';
      document.getElementById('wenyan-tap').textContent = '点击显示注释';
      noteVisible = false;
    }
    
    function toggleNote() {
      noteVisible = !noteVisible;
      document.getElementById('wenyan-note').style.display = noteVisible ? 'block' : 'none';
      document.getElementById('wenyan-tap').textContent = noteVisible ? '点击隐藏注释' : '点击显示注释';
    }
    
    function prev() {
      currentIndex--;
      if (currentIndex < 0) currentIndex = wenyanList.length - 1;
      show();
    }
    
    function next() {
      currentIndex++;
      if (currentIndex >= wenyanList.length) currentIndex = 0;
      show();
    }
    
    document.addEventListener('DOMContentLoaded', show);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豆瓣观影记录 - 简单即效率</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { 
            text-align: center; 
            color: #fff; 
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .subtitle { 
            text-align: center; 
            color: rgba(255,255,255,0.9); 
            margin-bottom: 30px;
        }
        .movie-list { 
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .movie-item { 
            padding: 15px;
            margin: 10px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.3s;
        }
        .movie-item:hover { background: #f8f9fa; }
        .movie-item:last-child { border-bottom: none; }
        .movie-title { 
            font-size: 15px; 
            color: #333;
            flex: 1;
        }
        .rating { display: flex; align-items: center; gap: 3px; }
        .star { 
            width: 18px; 
            height: 18px; 
            background: #ddd;
            border-radius: 2px;
            transition: background 0.3s;
        }
        .star.yellow { background: #ffb400; }
        .star-value { 
            margin-left: 8px; 
            color: #666; 
            font-size: 14px;
            font-weight: bold;
        }
        .no-rating { 
            color: #999; 
            font-size: 13px;
            padding: 2px 8px;
            background: #f0f0f0;
            border-radius: 4px;
        }
        .count { 
            text-align: center; 
            color: #666; 
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>
